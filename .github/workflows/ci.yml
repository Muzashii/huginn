name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Nenhum segredo versionado
        run: |
          ! git grep -nE "sk-ant-[A-Za-z0-9]|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}" -- ':!*.md'

  # Avaliação de recuperação de verdade: pgvector + Ollama + base real, sem LLM e sem custo.
  recuperacao:
    runs-on: ubuntu-latest
    needs: testes
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: huginn
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: huginn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U huginn" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://huginn:ci@localhost:5432/huginn
      OLLAMA_URL: http://localhost:11434
      EMBEDDINGS_MODEL: nomic-embed-text
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Ollama com nomic-embed-text
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:0.6.8
          for i in $(seq 1 30); do curl -sf localhost:11434/api/version && break; sleep 2; done
          docker exec ollama ollama pull nomic-embed-text
      - run: PGPASSWORD=ci psql -h localhost -U huginn -d huginn -f db/schema.sql
      - run: python scripts/ingestao_lote.py
      - run: python eval/avaliar.py --modo recuperacao --rotulo "CI ${GITHUB_SHA::7}" --min-hit 0.85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-recuperacao
          path: |
            eval/relatorio.md
            eval/respostas_*.jsonl
