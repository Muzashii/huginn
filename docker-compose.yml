# Huginn — n8n + PostgreSQL/pgvector + Ollama (embeddings locais, grátis)
# Subir:            docker compose up -d
# Com mock do Brokk: docker compose --profile mock up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huginn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-huginn}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huginn} -d ${POSTGRES_DB:-huginn}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.6.8
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  # Baixa o modelo de embeddings uma vez e sai.
  ollama-pull:
    image: ollama/ollama:0.6.8
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${EMBEDDINGS_MODEL:-nomic-embed-text}"]
    restart: "no"

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-1.97.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      # O Telegram só entrega webhooks em HTTPS público: aponte para o túnel (ver docs/runbook.md)
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # W1 usa crypto (hash do documento); os fluxos leem variáveis abaixo via $env
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      ATENDIMENTO_CHAT_ID: ${ATENDIMENTO_CHAT_ID:-0}
      BROKK_API_URL: ${BROKK_API_URL:-http://brokk-mock:8090}
      DRIVE_PASTA_BASE_ID: ${DRIVE_PASTA_BASE_ID:-}
      RETENCAO_DIAS: ${RETENCAO_DIAS:-90}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./base:/base:ro   # W1 manual lê os .md daqui
    ports:
      - "127.0.0.1:5678:5678"

  # API falsa do Brokk para desenvolver a ferramenta `orcamento` sem o Brokk real.
  brokk-mock:
    image: python:3.12-slim
    profiles: ["mock"]
    command: ["python", "/app/brokk_mock.py"]
    volumes:
      - ./scripts/brokk_mock.py:/app/brokk_mock.py:ro
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  pgdata:
  ollama:
  n8n_data:
